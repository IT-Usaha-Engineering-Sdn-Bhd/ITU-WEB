# Local dev only — Cloud Run uses Cloud SQL instead of the `db` service below.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload
    # Host port 5434 — 5432 is a native Postgres install
    # Bound to loopback only: the default credentials shouldn't be reachable from the LAN.
    ports: ['127.0.0.1:5434:5432']
    # postgres:18+ images store data directly under /var/lib/postgresql (not .../data) —
    # see https://github.com/docker-library/postgres/pull/1259.
    volumes: ['db-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payload']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build: .
    environment: &app-env
      DATABASE_URI: postgresql://payload:payload@db:5432/payload # container-to-container: still 5432
      DATABASE_POOL_MAX: 10
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-secret-change-me}
      SERVER_URL: http://localhost:3000
    command: ['npx', 'payload', 'migrate']
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports: ['127.0.0.1:3000:3000']
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
