name: Deploy to production

on:
  push:
    branches: [production]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  PROJECT_ID: prod-web-itu
  REGION: asia-southeast1
  SERVICE: itu-web
  JOB: itu-web-migrate
  IMAGE: asia-southeast1-docker.pkg.dev/prod-web-itu/itu-web/app:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run knip

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build image (Cloud Build)
        run: gcloud builds submit --project "$PROJECT_ID" --tag "$IMAGE"

      - name: Run migrations
        run: |
          gcloud run jobs update "$JOB" --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE"
          gcloud run jobs execute "$JOB" --project "$PROJECT_ID" --region "$REGION" --wait

      - name: Deploy service
        run: gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE"
